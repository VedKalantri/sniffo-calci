<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sniffo Calculator</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#f4f0e9;background:radial-gradient(circle at 75% 45%,#3b3028 0,#171615 35%,#090a0b 75%);display:flex;align-items:center;justify-content:center;overflow:hidden}
body:before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 50% 50%,transparent 0 25%,rgba(214,165,101,.08) 45%,transparent 70%);pointer-events:none}

.wrap{width:min(1260px,96vw);display:grid;grid-template-columns:1fr 540px 1fr;gap:42px;align-items:center}
.brand{position:absolute;top:32px;left:5vw;font-size:34px;letter-spacing:-2px;font-weight:500}
.brand small{display:block;font-size:9px;letter-spacing:5px;color:#aaa39a;margin-top:2px}
.copy h1{font-size:56px;line-height:1.03;font-weight:300;margin:0 0 22px}
.copy h1 span{color:#d7ad78}
.copy p{color:#aaa8a4;max-width:270px;line-height:1.7;font-size:15px}
.copy .line{width:60px;height:2px;background:#d4a66c;margin:30px 0}
.tag{font-size:10px;letter-spacing:4px;color:#99958f}

.calc{padding:32px;border:1px solid rgba(255,255,255,.24);border-radius:30px;background:linear-gradient(145deg,rgba(34,40,43,.9),rgba(10,13,14,.94));box-shadow:0 30px 90px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.15);backdrop-filter:blur(22px)}
.ctop{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.ctop b{font-size:24px}
.ctop span{font-size:9px;letter-spacing:4px;color:#9d9992;text-align:right}

.screen{height:155px;border:8px solid #272b29;border-radius:12px;background:#aeb59b;display:flex;align-items:center;justify-content:flex-end;padding:14px 18px;margin-bottom:22px;overflow:hidden;box-shadow:inset 0 3px 10px rgba(0,0,0,.3),0 2px 0 rgba(255,255,255,.08)}
.display{width:100%;font-family:"Courier New",monospace;font-size:clamp(28px,7vw,34px);font-weight:900;letter-spacing:1.2px;white-space:normal;text-align:right;color:#273025;text-shadow:0 1px rgba(255,255,255,.22);word-break:break-word;line-height:1.15}
.display.result-message{text-align:center;line-height:1.18;font-weight:900;color:#17130d;text-shadow:0 1px 0 rgba(255,255,255,.5),0 0 2px rgba(27,23,16,.85);letter-spacing:1.4px;font-size:clamp(29px,7.8vw,38px)}

.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.key{height:70px;border:0;border-radius:18px;background:linear-gradient(145deg,#242b2f,#171b1e);color:#eee;font-size:22px;cursor:pointer;box-shadow:inset 0 1px rgba(255,255,255,.07),0 5px 12px rgba(0,0,0,.2);transition:.14s transform,.14s background}
.key:hover{transform:translateY(-2px);background:#2d3438}
.key:active{transform:scale(.96)}
.op{color:#d9ae78}
.equals{background:linear-gradient(145deg,#e2bb86,#bd8c52);color:#111;font-weight:700}
.clear{color:#ddd}

.side{text-align:center;color:#9b9892}
.side .circle{width:180px;height:180px;border-radius:50%;border:1px solid rgba(218,176,124,.28);margin:auto;display:flex;align-items:center;justify-content:center;box-shadow:0 0 80px rgba(202,153,94,.08)}
.side strong{font-family:Georgia,serif;font-size:36px;font-weight:400;line-height:.9;color:#b7a28c}
.side p{font-size:11px;letter-spacing:3px;line-height:1.8;margin-top:25px}

@media(max-width:900px){
  body{min-height:100dvh;height:100dvh;overflow:hidden;padding:0;align-items:stretch;justify-content:stretch}
  .wrap{width:100%;height:100dvh;max-width:none;display:block}
  .copy,.side{display:none}
  .brand{position:fixed;top:max(14px,env(safe-area-inset-top));left:18px;z-index:10;font-size:29px}
  .calc{width:100%;height:100%;min-height:100dvh;margin:0;padding:calc(74px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));border-radius:0;border-left:0;border-right:0;display:flex;flex-direction:column}
  .ctop b{font-size:21px}
  .ctop span{font-size:8px;letter-spacing:3px}
  .screen{height:clamp(130px,22vh,190px);margin-bottom:18px;padding:12px 14px;flex-shrink:0}
  .display{font-size:clamp(25px,7.5vw,34px);letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:clip}
  .display.result-message{font-size:clamp(27px,8vw,36px);white-space:normal;line-height:1.2;letter-spacing:1px}
  .keys{gap:10px;flex:1;min-height:0;grid-auto-rows:1fr}
  .key{height:auto;min-height:0;border-radius:16px;font-size:clamp(18px,5vw,23px);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
}
@media(max-width:380px){
  .brand{left:16px;font-size:27px}
  .calc{padding-left:12px;padding-right:12px}
  .ctop{margin-bottom:12px}
  .ctop b{font-size:19px}
  .ctop span{display:none}
  .screen{height:clamp(118px,21vh,150px);padding:10px 11px}
  .display.result-message{font-size:24px}
  .keys{gap:7px}
  .key{border-radius:14px}
}
@media(max-height:700px) and (max-width:900px){
  .brand{top:max(10px,env(safe-area-inset-top))}
  .calc{padding-top:calc(62px + env(safe-area-inset-top))}
  .screen{height:clamp(100px,20vh,130px)}
}
</style>
</head>
<body>
<div class="brand">sniffo<small>SCENTS A BETTER YOU</small></div>
<div class="wrap">
<section class="copy"><h1>More than<br>just <span>numbers.</span></h1><p>Some results are calculated. Others simply smell better.</p><div class="line"></div><div class="tag">CALCULATE · EXPLORE · FEEL FRESH</div></section>

<main class="calc">
<div class="ctop"><b>Sniffo Calculator</b><span>GOOD VIBES<br>BETTER ANSWERS</span></div>
<div class="screen" id="screen"><div id="display" class="display">0</div></div>
<div class="keys">
<button class="key clear" onclick="clearAll()">C</button><button class="key" onclick="input('(')">(</button><button class="key" onclick="input(')')">)</button><button class="key op" onclick="input('%')">%</button>
<button class="key" onclick="input('7')">7</button><button class="key" onclick="input('8')">8</button><button class="key" onclick="input('9')">9</button><button class="key op" onclick="input('÷')">÷</button>
<button class="key" onclick="input('4')">4</button><button class="key" onclick="input('5')">5</button><button class="key" onclick="input('6')">6</button><button class="key op" onclick="input('×')">×</button>
<button class="key" onclick="input('1')">1</button><button class="key" onclick="input('2')">2</button><button class="key" onclick="input('3')">3</button><button class="key op" onclick="input('-')">−</button>
<button class="key" onclick="input('0')">0</button><button class="key" onclick="input('.')">.</button><button class="key" onclick="backspace()">⌫</button><button class="key equals" onclick="equals()">=</button>
</div></main>

<aside class="side"><div class="circle"><strong>Good<br>Scents<br>Better<br>Results</strong></div><p>BECAUSE YOU<br>DESERVE A SNIFFO</p></aside>
</div>

<script>
let expression='';
const display=document.getElementById('display');

function render(){
  display.textContent=expression||'0';
}

function input(v){
  display.classList.remove('result-message');
  expression+=v;
  render();
}

function clearAll(){
  display.classList.remove('result-message');
  expression='';
  render();
}

function backspace(){
  display.classList.remove('result-message');
  expression=expression.slice(0,-1);
  render();
}

function equals(){
  if(!expression)return;
  display.classList.add('result-message');
  display.innerHTML='YOU DESERVE A<br>SNIFFO PERFUME';
}

document.addEventListener('keydown',e=>{
  if(/[0-9.+\-*/()%]/.test(e.key)){
    input(e.key==='*'?'×':e.key==='/'?'÷':e.key);
  }else if(e.key==='Enter'||e.key==='='){
    equals();
  }else if(e.key==='Backspace'){
    backspace();
  }else if(e.key==='Escape'){
    clearAll();
  }
});
</script>
</body>
</html>
