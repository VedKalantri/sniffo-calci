<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sniffo Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#f4f0e9;background:radial-gradient(circle at 75% 45%,#3b3028 0,#171615 35%,#090a0b 75%);display:flex;align-items:center;justify-content:center;overflow:hidden}
body:before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 50% 50%,transparent 0 25%,rgba(214,165,101,.08) 45%,transparent 70%);pointer-events:none}
.wrap{width:min(1180px,94vw);display:grid;grid-template-columns:1fr 470px 1fr;gap:38px;align-items:center}.brand{position:absolute;top:32px;left:5vw;font-size:34px;letter-spacing:-2px;font-weight:500}.brand small{display:block;font-size:9px;letter-spacing:5px;color:#aaa39a;margin-top:2px}.copy h1{font-size:56px;line-height:1.03;font-weight:300;margin:0 0 22px}.copy h1 span{color:#d7ad78}.copy p{color:#aaa8a4;max-width:270px;line-height:1.7;font-size:15px}.copy .line{width:60px;height:2px;background:#d4a66c;margin:30px 0}.tag{font-size:10px;letter-spacing:4px;color:#99958f}.calc{padding:28px;border:1px solid rgba(255,255,255,.24);border-radius:30px;background:linear-gradient(145deg,rgba(34,40,43,.9),rgba(10,13,14,.94));box-shadow:0 30px 90px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,.15);backdrop-filter:blur(22px)}.ctop{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.ctop b{font-size:22px}.ctop span{font-size:9px;letter-spacing:4px;color:#9d9992;text-align:right}.screen{height:145px;border:8px solid #272b29;border-radius:12px;background:#aeb59b;display:flex;align-items:center;justify-content:flex-end;padding:14px 18px;margin-bottom:22px;overflow:hidden;box-shadow:inset 0 3px 10px rgba(0,0,0,.3),0 2px 0 rgba(255,255,255,.08)}.display{width:100%;font-family:"Courier New",monospace;font-size:clamp(16px,4.5vw,21px);font-weight:900;letter-spacing:1.2px;white-space:normal;text-align:right;color:#273025;text-shadow:0 1px rgba(255,255,255,.22);word-break:break-word;line-height:1.15}.display.result-message{text-align:center;line-height:1.18;font-weight:900;color:#1b1710;text-shadow:0 1px 0 rgba(255,255,255,.45),0 0 1px rgba(27,23,16,.8);letter-spacing:1.35px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.key{height:62px;border:0;border-radius:18px;background:linear-gradient(145deg,#242b2f,#171b1e);color:#eee;font-size:20px;cursor:pointer;box-shadow:inset 0 1px rgba(255,255,255,.07),0 5px 12px rgba(0,0,0,.2);transition:.14s transform,.14s background}.key:hover{transform:translateY(-2px);background:#2d3438}.key:active{transform:scale(.96)}.op{color:#d9ae78}.equals{background:linear-gradient(145deg,#e2bb86,#bd8c52);color:#111;font-weight:700}.clear{color:#ddd}.side{text-align:center;color:#9b9892}.side .circle{width:180px;height:180px;border-radius:50%;border:1px solid rgba(218,176,124,.28);margin:auto;display:flex;align-items:center;justify-content:center;box-shadow:0 0 80px rgba(202,153,94,.08)}.side strong{font-family:Georgia,serif;font-size:36px;font-weight:400;line-height:.9;color:#b7a28c}.side p{font-size:11px;letter-spacing:3px;line-height:1.8;margin-top:25px}@media(max-width:900px){
  body{
    min-height:100dvh;
    overflow-x:hidden;
    padding:88px 14px 18px;
    align-items:center;
  }
  .wrap{
    width:100%;
    max-width:520px;
    display:block;
  }
  .copy,.side{display:none}
  .brand{
    position:fixed;
    top:22px;
    left:22px;
    z-index:10;
    font-size:30px;
  }
  .calc{
    width:100%;
    margin:0 auto;
    padding:20px;
    border-radius:24px;
  }
  .ctop b{font-size:20px}
  .ctop span{font-size:8px;letter-spacing:3px}
  .screen{
    height:132px;
    margin-bottom:18px;
    padding:12px 14px;
  }
  .display{
    font-size:clamp(11px,4.2vw,17px);
    letter-spacing:.7px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:clip;
  }
  .keys{
    gap:9px;
  }
  .key{
    height:clamp(54px,14vw,64px);
    border-radius:16px;
    font-size:clamp(18px,5vw,21px);
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
}
@media(max-width:380px){
  body{padding:78px 9px 12px}
  .brand{left:16px;top:17px;font-size:27px}
  .calc{padding:14px;border-radius:20px}
  .ctop{margin-bottom:14px}
  .ctop b{font-size:18px}
  .ctop span{display:none}
  .screen{height:118px;padding:10px 11px}
  .keys{gap:7px}
  .key{height:54px;border-radius:14px}
}
@media(max-height:700px) and (max-width:900px){
  body{padding-top:68px;padding-bottom:8px}
  .brand{top:12px}
  .screen{height:105px}
  .key{height:50px}
}
</style>
</head>
<body>
<div class="brand">sniffo<small>SCENTS A BETTER YOU</small></div>
<div class="wrap">
<section class="copy"><h1>More than<br>just <span>numbers.</span></h1><p>Some results are calculated. Others simply smell better.</p><div class="line"></div><div class="tag">CALCULATE · EXPLORE · FEEL FRESH</div></section>
<main class="calc">
<div class="ctop"><b>Sniffo Calculator</b><span>GOOD VIBES<br>BETTER ANSWERS</span></div>
<div class="screen" id="screen"><div id="display" class="display">0</div></div>
<div class="keys">
<button class="key clear" onclick="clearAll()">C</button><button class="key" onclick="input('(')">(</button><button class="key" onclick="input(')')">)</button><button class="key op" onclick="input('%')">%</button>
<button class="key" onclick="input('7')">7</button><button class="key" onclick="input('8')">8</button><button class="key" onclick="input('9')">9</button><button class="key op" onclick="input('÷')">÷</button>
<button class="key" onclick="input('4')">4</button><button class="key" onclick="input('5')">5</button><button class="key" onclick="input('6')">6</button><button class="key op" onclick="input('×')">×</button>
<button class="key" onclick="input('1')">1</button><button class="key" onclick="input('2')">2</button><button class="key" onclick="input('3')">3</button><button class="key op" onclick="input('-')">−</button>
<button class="key" onclick="input('0')">0</button><button class="key" onclick="input('.')">.</button><button class="key" onclick="backspace()">⌫</button><button class="key equals" onclick="equals()">=</button>
</div></main>
<aside class="side"><div class="circle"><strong>Good<br>Scents<br>Better<br>Results</strong></div><p>BECAUSE YOU<br>DESERVE A SNIFFO</p></aside>
</div>
<script>
let expression='';
const display=document.getElementById('display');
function render(){display.textContent=expression||'0';}
function input(v){display.classList.remove('result-message');expression+=v;render();}
function clearAll(){display.classList.remove('result-message');expression='';render();}
function backspace(){display.classList.remove('result-message');expression=expression.slice(0,-1);render();}
function equals(){
 if(!expression)return;
 display.classList.add('result-message'); display.innerHTML='YOU DESERVE A<br>SNIFFO PERFUME';
}
document.addEventListener('keydown',e=>{
 if(/[0-9.+\-*/()%]/.test(e.key)){input(e.key==='*'?'×':e.key==='/ ' ? '÷':e.key);}
 else if(e.key==='Enter'||e.key==='=')equals();
 else if(e.key==='Backspace')backspace();
 else if(e.key==='Escape')clearAll();
});
</script>
</body>
</html>
